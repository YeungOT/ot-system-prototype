<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訓練時間表</title>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("embed")) {
      document.documentElement.classList.add("embedded");
    }
    if (params.has("dev")) {
      document.documentElement.classList.add("developer");
    }
  </script>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --line: #d8e1e7;
      --line-strong: #b8c5ce;
      --ink: #111827;
      --muted: #64748b;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --teal-soft: #e7f3f1;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --amber: #b45309;
      --amber-soft: #fff7ed;
      --green: #15803d;
      --green-soft: #f0fdf4;
      --red: #b91c1c;
      --red-soft: #fef2f2;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible,
    [tabindex]:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(15, 118, 110, .25);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app { min-height: 100vh; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; border-bottom: 1px solid var(--line); }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: var(--teal);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
    }
    .brand-title { font-weight: 800; }
    .brand-sub { color: var(--muted); font-size: 11px; }
    .nav { display: grid; gap: 4px; }
    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 9px 10px;
      border-radius: 7px;
      color: #334155;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .nav button:hover { background: #f1f5f9; }
    .nav button.active { background: var(--teal-soft); color: var(--teal-dark); font-weight: 800; }
    .nav small { color: var(--muted); font-size: 10px; }

    .main { min-width: 0; display: grid; grid-template-rows: 58px minmax(0, 1fr); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
    }
    .home-pill {
      min-width: 180px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .top-meta { color: var(--muted); }
    .user-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      padding: 5px 10px 5px 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .content { min-width: 0; padding: 18px; }
    .screen-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: 0; }
    .sub { color: var(--muted); margin-top: 5px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      padding: 7px 11px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }
    .btn:hover { background: #f8fafc; }
    .btn:disabled { color: #94a3b8; cursor: not-allowed; background: #f8fafc; }
    .btn-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-primary:disabled { background: #cbd5e1; border-color: #cbd5e1; color: #f8fafc; }
    .icon-btn {
      width: 34px;
      min-height: 34px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 17px;
      line-height: 1;
    }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f8fafc;
      padding: 2px;
    }
    .segmented button {
      min-width: 48px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      padding: 5px 10px;
      color: var(--muted);
      font-weight: 800;
    }
    .segmented button.active { background: var(--surface); color: var(--teal-dark); box-shadow: var(--shadow); }

    .cadence {
      flex: 0 0 auto;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: #edf1f4;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      overflow: hidden;
      margin: 0;
      padding: 3px;
      gap: 2px;
    }
    .cadence-week {
      min-width: 0;
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--surface);
      padding: 7px 10px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .cadence-week:last-child { border-right: 0; }
    .cadence-week::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 3px;
      background: transparent;
    }
    .cadence-week:hover { background: #f8fafc; }
    .cadence-week.active { background: #f2fbf9; }
    .cadence-week.active::before { background: var(--teal); }
    .cadence-week strong { flex: 0 0 auto; font-size: 11px; white-space: nowrap; }
    .cadence-week span { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .cadence-week .week-count {
      margin-left: auto;
      color: var(--teal-dark);
      font-weight: 800;
      font-size: 11px;
    }

    .workbench {
      display: grid;
      grid-template-columns: 226px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      min-height: 0;
      height: calc(100vh - 82px);
    }
    .resident-panel,
    .schedule-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-head {
      min-height: 42px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      font-weight: 800;
    }
    .panel-head small { color: var(--muted); font-weight: 600; }
    .resident-queue {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 10px;
      background: #f8fafc;
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }
    .queue-list {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: scroll;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .queue-list::-webkit-scrollbar { width: 9px; }
    .queue-list::-webkit-scrollbar-track { background: #eef2f5; }
    .queue-list::-webkit-scrollbar-thumb {
      border: 2px solid #eef2f5;
      border-radius: 999px;
      background: #aebac4;
      background-clip: content-box;
    }
    .resident-panel {
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    .resident-queue > .queue-group { min-height: 0; }
    .schedule-panel { min-height: 0; display: flex; flex-direction: column; }
    .schedule-scroll { min-height: 0; overflow: auto; }
    .resident-panel.session-remove-target {
      border-color: #fca5a5;
      box-shadow: inset 0 0 0 2px #fca5a5;
    }
    .resident-panel.session-remove-target .panel-head {
      background: var(--red-soft);
      color: var(--red);
    }
    .resident-panel.session-remove-target .panel-head small::after {
      content: " · 放開以移除";
      color: var(--red);
    }
    .resident-panel.session-remove-target .resident-queue { background: #fffafa; }
    .queue-group {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .queue-group + .queue-group { border-top: 1px solid var(--line); }
    .queue-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      color: var(--muted);
      background: #fbfcfd;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 800;
    }
    .resident-row {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 6px 10px 6px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      text-align: left;
      cursor: grab;
      position: relative;
    }
    .resident-row:hover { background: #f8fafc; }
    .resident-row.dragging { opacity: .45; }
    .resident-row.selected { background: var(--teal-soft); }
    .resident-row.selected::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--teal);
    }
    .resident-row.complete .progress-value { color: var(--green); }
    .resident-name { display: flex; align-items: center; gap: 6px; font-weight: 800; }
    .resident-progress { text-align: right; }
    .progress-value { font-weight: 800; font-size: 12px; }
    .resident-progress small { display: block; color: var(--muted); font-size: 10px; }
    .resident-clinical-popover {
      position: fixed;
      z-index: 130;
      width: min(270px, calc(100vw - 24px));
      border: 1px solid #cbd9e2;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 42px rgba(15, 23, 42, .2);
      padding: 10px;
      color: var(--ink);
      pointer-events: none;
    }
    .resident-clinical-popover[hidden] { display: none; }
    .resident-clinical-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .resident-clinical-head strong { font-size: 12px; }
    .resident-clinical-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .resident-clinical-grid div {
      min-width: 0;
      border-radius: 5px;
      background: #f8fafc;
      padding: 5px 6px;
    }
    .resident-clinical-grid span {
      display: block;
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
    }
    .resident-clinical-grid strong {
      display: block;
      margin-top: 1px;
      font-size: 10px;
      line-height: 1.2;
    }

    .schedule-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .schedule-toolbar {
      min-height: 42px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 7px 9px 7px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .schedule-toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .schedule-toolbar-actions { margin-left: auto; }
    .week-nav { display: flex; align-items: center; gap: 7px; }
    .week-nav strong { min-width: 150px; text-align: center; }
    .week-nav .btn { box-shadow: none; }
    .schedule-meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .drop-feedback {
      min-height: 38px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drop-feedback strong { color: var(--ink); }
    .drop-feedback.valid { background: var(--green-soft); color: #166534; }
    .drop-feedback.invalid { background: var(--red-soft); color: var(--red); }
    .drop-feedback.valid strong,
    .drop-feedback.invalid strong { color: inherit; }
    .schedule-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .week-grid,
    .month-grid {
      display: grid;
      grid-template-columns: 74px repeat(4, minmax(165px, 1fr));
      min-width: 734px;
    }
    .day-head,
    .time-head,
    .time-label,
    .slot {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .day-head.day-last,
    .slot.day-last { border-right: 0; }
    .day-head,
    .time-head {
      min-height: 30px;
      background: #f8fafc;
      padding: 5px 8px;
      color: #334155;
      font-size: 11px;
      font-weight: 800;
    }
    .day-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .day-head span { color: var(--muted); font-weight: 600; }
    .day-head .missing-rota {
      margin-left: auto;
      color: var(--red);
      font-size: 9px;
      font-style: normal;
      font-weight: 800;
    }
    .time-head { display: grid; place-items: center; text-align: center; }
    .week-grid .time-head,
    .month-grid .time-head {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 8;
    }
    .week-grid .day-head,
    .month-grid .day-head {
      position: sticky;
      top: 0;
      z-index: 6;
    }
    .time-label {
      min-height: 28px;
      background: #fbfcfd;
      padding: 2px 7px;
      color: #475569;
      font-size: 9px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1px;
      line-height: 1;
    }
    .time-label.lunch { background: var(--red-soft); color: var(--red); }
    .slot {
      min-height: 28px;
      padding: 2px 4px;
      background: var(--surface);
      display: grid;
      align-content: start;
      gap: 3px;
      position: relative;
      transition: background .12s ease, box-shadow .12s ease;
    }
    .slot.lunch {
      background: #fff5f5;
      box-shadow: inset 0 0 0 1px #fecaca;
      cursor: not-allowed;
    }
    .slot.lunch:hover { background: #feeeee; }
    .slot:hover { background: #fcfefe; }
    .slot-empty-label {
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 8px;
      font-weight: 700;
    }
    .day-head.outside-month,
    .slot.readonly {
      background: #f1f5f9;
      opacity: .58;
    }
    .week-grid .time-label,
    .week-grid .slot {
      min-height: 44px;
    }
    .slot.drop-valid {
      background: #f0fdf4;
      box-shadow: inset 0 0 0 1px #86efac;
    }
    .slot.drop-invalid {
      background: #fef2f2;
      box-shadow: inset 0 0 0 1px #fca5a5;
    }
    .slot.drop-target.drop-valid {
      background: #dcfce7;
      box-shadow: inset 0 0 0 3px #16a34a;
    }
    .slot.drop-target.drop-invalid {
      background: #fee2e2;
      box-shadow: inset 0 0 0 3px #dc2626;
    }
    .slot.is-empty { cursor: crosshair; }
    .slot-sessions {
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 3px;
    }
    .slot-sessions.parallel {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
    }
    .session-card {
      min-width: 0;
      min-height: 22px;
      border: 1px solid #9fd3c9;
      border-radius: 5px;
      background: #edf8f5;
      color: var(--teal-dark);
      padding: 2px 5px;
      display: grid;
      gap: 1px;
      cursor: grab;
      position: relative;
    }
    .session-card:hover { background: #e2f4f0; }
    .session-card.combine-valid {
      outline: 2px solid #16a34a;
      outline-offset: 1px;
      background: #dcfce7;
    }
    .session-card.combine-invalid {
      outline: 2px solid #dc2626;
      outline-offset: 1px;
      background: #fee2e2;
    }
    .session-card.group {
      border-color: #a9c4f7;
      background: #edf3ff;
      color: #1d4ed8;
      gap: 3px;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .04);
    }
    .session-card.group:hover { background: #e3edff; }
    .session-card.paid { background: var(--amber-soft); color: var(--amber); }
    .session-card.category-monthly { border-color: #93c5fd; background: #eff6ff; color: #1d4ed8; }
    .session-card.category-extra { border-color: #fdba74; background: #fff7ed; color: #b45309; }
    .session-card.dragging { opacity: .42; }
    .session-top { display: flex; align-items: flex-start; gap: 5px; min-width: 0; }
    .format-mark {
      min-width: 20px;
      border-radius: 3px;
      background: #d8f0eb;
      color: var(--teal-dark);
      padding: 1px 4px;
      font-size: 9px;
      font-weight: 900;
      text-align: center;
    }
    .group .format-mark { background: #dbe8ff; color: #1d4ed8; }
    .bed-number {
      min-width: 25px;
      border-radius: 3px;
      background: #edf2f5;
      color: #475569;
      padding: 1px 4px;
      font-size: 9px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 0;
    }
    .session-name {
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .individual-line {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .slot-sessions.parallel .session-card {
      padding: 2px 3px;
    }
    .slot-sessions.parallel .individual-line {
      gap: 3px;
    }
    .slot-sessions.parallel .format-mark {
      min-width: 16px;
      padding-inline: 2px;
      font-size: 8px;
    }
    .slot-sessions.parallel .bed-number {
      min-width: 20px;
      padding-inline: 2px;
      font-size: 8px;
    }
    .slot-sessions.parallel .session-name {
      font-size: 9px;
    }
    .group-heading {
      min-height: 17px;
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      padding-block: 0;
      cursor: grab;
      user-select: none;
    }
    .suggested-activity {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      color: #475569;
      font-size: 9px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #fff;
      border: 1px solid #d8e1e7;
      border-radius: 3px;
      padding: 0 4px;
    }
    .group-heading::after {
      content: "";
      width: 10px;
      height: 12px;
      margin-left: 1px;
      opacity: .52;
      background-image: radial-gradient(circle, currentColor 1px, transparent 1.2px);
      background-size: 4px 4px;
      background-position: center;
      color: #9aa8b4;
    }
    .group-capacity {
      margin-left: auto;
      color: #526071;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }
    .group-members {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
    }
    .schedule-resident-card {
      min-width: 0;
      min-height: 27px;
      border: 1px solid #d7e4fb;
      border-radius: 4px;
      background: #fff;
      padding: 1px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 1px;
      color: #1f2937;
      cursor: grab;
      text-align: center;
      user-select: none;
    }
    .schedule-resident-card:hover { background: #f2f6ff; border-color: #aec8f5; }
    .schedule-resident-card.dragging { opacity: .4; }
    .schedule-resident-card .bed-number {
      min-width: 0;
      background: #eef4ff;
      color: #1d4ed8;
      padding-inline: 2px;
      font-size: 7px;
    }
    .schedule-resident-name {
      min-width: 0;
      max-width: 100%;
      font-size: 8px;
      font-weight: 800;
      line-height: 1.05;
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
    }
    .session-meta {
      color: #526071;
      font-size: 9px;
      display: flex;
      justify-content: space-between;
      gap: 5px;
      align-items: center;
    }
    .activity-select {
      min-width: 0;
      max-width: 110px;
      border: 0;
      border-bottom: 1px dotted #94a3b8;
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: 9px;
      font-weight: 800;
    }

    .month-stack { display: grid; gap: 12px; padding: 10px; }
    .month-week { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    .month-week-foot {
      min-height: 34px;
      padding: 6px 10px;
      background: #f8fafc;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .month-week-foot strong { font-size: 11px; }
    .month-week-foot span { color: var(--muted); font-size: 10px; }
    .month-grid .time-label { min-height: 32px; padding-block: 3px; }
    .month-grid .slot { min-height: 32px; padding: 2px 3px; }
    .month-grid .day-head,
    .month-grid .time-head { min-height: 34px; padding-block: 5px; }
    .compact-summary {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fcfefe;
      padding: 2px 4px;
      display: grid;
      align-content: center;
      gap: 1px;
      color: #475569;
      font-size: 9px;
      font-weight: 800;
    }
    .compact-summary strong { color: var(--ink); font-size: 10px; }
    .compact-summary .compact-names {
      overflow: hidden;
      width: 100%;
      color: #334155;
      font-size: 9px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .compact-summary .compact-range {
      color: #1d4ed8;
      font-size: 8px;
      font-weight: 800;
    }
    .service-switch {
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }
    .service-switch .segmented { width: 100%; }
    .service-switch .segmented button { flex: 1; }
    .compact-summary.individual {
      border-color: #9fd3c9;
      background: #edf8f5;
    }
    .compact-summary.group {
      border-color: #a9c4f7;
      background: #edf3ff;
    }
    .month-grid .slot.expanded .compact-summary { display: none; }
    .month-grid .slot:not(.expanded) .session-card { display: none; }
    .month-grid .slot .direct-cards .session-card { display: grid; }
    .month-grid .slot.expanded { align-content: start; }
    .month-grid { position: relative; }
    .compact-summary.merged-hidden { display: none; }
    .merged-individual-block {
      position: absolute;
      z-index: 6;
      border: 1px solid #7fbdb3;
      border-radius: 6px;
      background: #edf8f5;
      color: var(--teal-dark);
      padding: 7px 8px;
      display: grid;
      place-content: center;
      gap: 2px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(15, 23, 42, .12);
      pointer-events: none;
    }
    .merged-individual-block strong { font-size: 11px; }
    .merged-individual-block span { color: #475569; font-size: 9px; }
    .merged-individual-block small { color: #64748b; font-size: 8px; }

    dialog {
      width: min(560px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0;
      color: var(--ink);
      box-shadow: 0 24px 60px rgba(15, 23, 42, .24);
    }
    dialog::backdrop { background: rgba(15, 23, 42, .35); }
    .dialog-head { padding: 15px 17px 11px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 17px; }
    .dialog-head p { margin: 4px 0 0; color: var(--muted); }
    .dialog-body { padding: 14px 17px; }
    .autofill-preference {
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 9px 10px;
    }
    .autofill-preference strong { display: block; font-size: 11px; }
    .autofill-preference small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }
    .autofill-time-options {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .autofill-time-options label {
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      padding: 4px 7px;
      font-size: 10px;
    }
    .autofill-time-options input { margin-right: 4px; }
    .autofill-summary { display: grid; gap: 9px; }
    .autofill-summary-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 1px 2px 3px;
    }
    .autofill-summary-total strong { font-size: 13px; }
    .autofill-summary-total span { color: var(--muted); font-size: 11px; }
    .autofill-week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 7px;
    }
    .autofill-week-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 9px 10px;
      display: grid;
      gap: 5px;
    }
    .autofill-week-card strong { font-size: 12px; }
    .autofill-week-card small {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }
    .autofill-week-card span {
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
    }
    .autofill-empty {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 12px;
      color: var(--muted);
      font-size: 11px;
    }
    .autofill-exceptions {
      border: 1px solid #fed7aa;
      border-radius: 8px;
      background: var(--amber-soft);
      color: #92400e;
      padding: 9px 11px;
      font-size: 11px;
    }
    .autofill-exceptions strong { display: block; margin-bottom: 4px; }
    .autofill-exceptions ul { margin: 0; padding-left: 18px; }
    .scope-dialog {
      width: min(440px, calc(100vw - 32px));
      padding: 12px;
    }
    .scope-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .scope-option {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 12px 14px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      box-shadow: none;
    }
    .scope-option:hover {
      border-color: #9acbc4;
      background: #f4fbf9;
    }
    .dialog-actions {
      padding: 11px 17px 15px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      max-width: min(390px, calc(100vw - 36px));
      border: 1px solid #334155;
      border-radius: 7px;
      background: #111827;
      color: #fff;
      padding: 10px 13px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .24);
      transform: translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .save-status-corner {
      position: fixed;
      left: 16px;
      bottom: 8px;
      z-index: 20;
      border-radius: 4px;
      background: rgba(247, 250, 249, .9);
      color: var(--muted);
      padding: 2px 4px;
      font-size: 10px;
      pointer-events: none;
    }

    @media (max-width: 1120px) {
      .app { grid-template-columns: 72px minmax(0, 1fr); }
      .brand-title, .brand-sub, .nav small { display: none; }
      .sidebar { padding-inline: 8px; }
      .workbench { grid-template-columns: 226px minmax(0, 1fr); }
    }
    @media (max-width: 900px) {
      .screen-head { flex-direction: column; }
      .workbench { grid-template-columns: minmax(0, 1fr); }
      .resident-queue { height: 340px; }
      .schedule-toolbar-actions { margin-left: 0; }
    }
    @media (max-width: 680px) {
      .content { padding: 12px; }
      .sidebar { display: none; }
      .app { display: block; }
      .main { display: block; }
      .topbar { min-height: 54px; padding-inline: 12px; }
      .home-pill { min-width: 140px; }
      .top-meta.hide-mobile { display: none; }
      .cadence-week { padding-inline: 7px; }
      .cadence-week span:not(.week-count) { display: none; }
      .week-nav strong { min-width: 126px; }
      .schedule-toolbar-actions { width: 100%; justify-content: flex-end; }
      .scope-options { grid-template-columns: 1fr; }
      .scope-option { min-height: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    html.embedded .sidebar,
    html.embedded .topbar { display: none; }
    html.embedded .app { display: block; }
    html.embedded .main { display: block; }
    html.embedded body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    html.embedded .content {
      height: 100vh;
      height: 100dvh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    html.embedded .screen-head {
      flex: 0 0 auto;
    }
    html.embedded .workbench {
      flex: 1 1 auto;
      min-height: 0;
    }
    html.embedded .resident-panel,
    html.embedded .schedule-panel {
      height: 100%;
    }
    @media (max-width: 900px) {
      html.embedded body { overflow: auto; }
      html.embedded .content {
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: visible;
      }
      html.embedded .workbench { flex: none; }
      html.embedded .resident-panel,
      html.embedded .schedule-panel { height: auto; }
    }
    .dev-only { display: none !important; }
    html.developer .dev-only { display: inline-flex !important; }
  </style>

</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">OT</div>
        <div>
          <div class="brand-title">OT System</div>
          <div class="brand-sub">訓練時間表</div>
        </div>
      </div>
      <nav class="nav" aria-label="系統模組">
        <button><span>工作台</span><small>首頁</small></button>
        <button><span>住客管理</span><small>007</small></button>
        <button class="active"><span>訓練時間表</span><small>006</small></button>
        <button><span>復康運動紀錄</span><small>007a / 007c</small></button>
        <button><span>評估系統</span><small>016 / MOCA</small></button>
        <button><span>ICP</span><small>週期</small></button>
        <button><span>院舍設定</span><small>設定</small></button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="home-pill">
          <span><strong id="chrome-home-code">yt</strong> <span id="chrome-home-name">油塘康璟</span></span>
          <span class="ui-chevron" aria-hidden="true"></span>
        </div>
        <div class="topbar-actions">
          <span class="top-meta hide-mobile">2026年10月</span>
          <span class="top-meta hide-mobile">OT</span>
          <div class="user-pill"><span class="avatar">T</span><span>OT</span></div>
        </div>
      </header>

      <div class="content">
        <div class="workbench">
          <article class="resident-panel" aria-label="住客清單">
            <div class="service-switch">
              <div class="segmented" role="tablist" aria-label="服務類型">
                <button class="active" type="button" role="tab" aria-selected="true" data-service-mode="basic">基本</button>
                <button type="button" role="tab" aria-selected="false" data-service-mode="extra">額外服務</button>
              </div>
            </div>
            <div class="resident-queue" id="resident-queue"></div>
          </article>

          <article class="schedule-panel" aria-label="訓練時段">
            <section class="cadence" id="cadence" aria-label="本月週次"></section>
            <div class="schedule-toolbar">
              <div class="schedule-toolbar-group">
                <div class="segmented" role="group" aria-label="時間表檢視">
                  <button type="button" class="active" data-view="week" aria-pressed="true">週</button>
                  <button type="button" data-view="month" aria-pressed="false">月</button>
                </div>
                <button class="btn" type="button" data-action="open-autofill">
                  自動填入
                </button>
              </div>
              <div class="schedule-toolbar-group schedule-toolbar-actions">
                <button class="btn icon-btn" type="button" data-action="undo" id="undo-button" title="復原上一步" aria-label="復原上一步">
                  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 7 4 12l5 5"></path>
                    <path d="M5 12h8a6 6 0 0 1 6 6"></path>
                  </svg>
                </button>
                <button class="btn icon-btn" type="button" data-action="redo" id="redo-button" title="重做" aria-label="重做">
                  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m15 7 5 5-5 5"></path>
                    <path d="M19 12h-8a6 6 0 0 0-6 6"></path>
                  </svg>
                </button>
                <button class="btn dev-only" type="button" data-action="reset-demo">重設示範</button>
                <button class="btn btn-primary" type="button" data-action="complete" id="complete-button">完成時間表</button>
              </div>
            </div>
            <div class="schedule-scroll" id="schedule-grid"></div>
          </article>
        </div>
        <small class="save-status-corner" id="last-saved">尚未變更</small>
      </div>
    </main>
  </div>

  <dialog id="autofill-dialog" aria-labelledby="autofill-title">
    <div class="dialog-head">
      <h2 id="autofill-title">自動填入所有住客</h2>
      <p>補齊目前月份及所選週期所需節數；現有安排不會被覆蓋。</p>
    </div>
    <div class="dialog-body">
      <div class="autofill-preference">
        <strong>優先時段</strong>
        <small>只影響自動排期排序；仍會遵守容量、每日節數及每月間隔限制。</small>
        <div class="autofill-time-options" id="autofill-time-options"></div>
      </div>
      <div class="autofill-summary" id="autofill-list" aria-live="polite"></div>
    </div>
    <div class="dialog-actions">
      <button class="btn" type="button" data-action="close-dialog">取消</button>
      <button class="btn btn-primary" type="button" data-action="confirm-autofill" id="confirm-autofill">填入</button>
    </div>
  </dialog>

  <dialog class="scope-dialog" id="week-scope-dialog" aria-label="變更範圍">
    <div class="scope-options" role="group" aria-label="變更範圍">
      <button class="scope-option" type="button" data-action="week-scope" data-scope="current">只限本週</button>
      <button class="scope-option" type="button" data-action="week-scope" data-scope="all">套用到所有週次</button>
    </div>
  </dialog>

  <div class="resident-clinical-popover" id="resident-clinical-popover" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared/home-settings.js"></script>
  <script src="../shared/prototype-catalog.js"></script>
  <script src="../shared/mock-residents.js"></script>
  <script src="../shared/prototype-domain.js"></script>
  <script src="../shared/training-planner-v2.js?v=20261116-legacy-format-v3"></script>
  <script src="../shared/ui-system.js?v=20261116-browser-comments"></script>
</body>
