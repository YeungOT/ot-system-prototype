<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OT System</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --line: #d8e1e7;
      --ink: #111827;
      --muted: #64748b;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --teal-soft: #e7f3f1;
      --workspace-surface: #f7faf9;
      --shell-surface: #ffffff;
      --sidebar-expanded: 216px;
      --sidebar-collapsed: 76px;
      --topbar-height: 64px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--shell-surface);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    button { font: inherit; cursor: pointer; }

    .app {
      display: grid;
      grid-template-rows: var(--topbar-height) minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      border-radius: 0;
      background: var(--shell-surface);
    }
    .app-body {
      display: grid;
      grid-template-columns: var(--sidebar-expanded) minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--shell-surface);
      transition: grid-template-columns .18s ease;
    }
    .app.sidebar-collapsed .app-body {
      grid-template-columns: var(--sidebar-collapsed) minmax(0, 1fr);
    }
    .app.sidebar-collapsed .sidebar {
      padding-inline: 10px;
    }
    .sidebar {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--shell-surface);
      border-right: 0;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
    }
    .nav { display: grid; gap: 4px; }
    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 9px 10px;
      border-radius: 7px;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
    }
    .nav-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav button:hover { background: #f1f5f9; }
    .nav button.active {
      background: var(--teal-soft);
      color: var(--teal-dark);
      font-weight: 800;
    }

    .main {
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      border: 0;
      border-start-start-radius: 20px;
      background: var(--workspace-surface);
      box-shadow: none;
      position: relative;
    }
    .topbar {
      position: relative;
      z-index: 10;
      min-width: 0;
      background: var(--shell-surface);
      border-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px 0 30px;
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 10px;
    }
    .sidebar-toggle {
      width: 100%;
      min-height: 36px;
      margin: 0;
      padding: 0 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      transition: background-color .15s ease, color .15s ease;
    }
    .toggle-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: grid;
      place-items: center;
      transform: rotate(180deg);
      transition: transform .18s ease;
    }
    .toggle-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .toggle-label { white-space: nowrap; }
    .sidebar-toggle:hover { background: #f1f5f9; }
    .sidebar-toggle:focus-visible {
      outline: 3px solid rgba(15, 118, 110, .25);
      outline-offset: 2px;
    }
    .app.sidebar-collapsed .nav-label { display: none; }
    .app.sidebar-collapsed .nav button { justify-content: flex-start; padding-inline: 10px; }
    .app.sidebar-collapsed .sidebar-toggle {
      width: 100%;
      min-height: 36px;
      padding: 0 11px;
      justify-content: flex-start;
    }
    .app.sidebar-collapsed .toggle-label { display: none; }
    .app.sidebar-collapsed .toggle-icon { transform: none; }
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .home-select {
      width: min(280px, calc(100vw - 220px));
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, transparent 50%, #62666d 50%),
        linear-gradient(135deg, #62666d 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 16px,
        calc(100% - 13px) 16px;
      background-repeat: no-repeat;
      background-size: 5px 5px, 5px 5px;
      outline: 0;
      color: var(--ink);
      padding: 0 38px 0 14px;
      font-weight: 500;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .home-select:focus-visible {
      outline: 3px solid rgba(15, 118, 110, .25);
      outline-offset: 2px;
    }
    .top-meta { color: var(--muted); }
    .user-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 5px 10px 5px 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .stage {
      position: relative;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      background: var(--workspace-surface);
    }
    .module-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--workspace-surface);
    }
    .placeholder {
      height: 100%;
      padding: 18px;
    }
    .placeholder-panel {
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .placeholder-panel strong { color: var(--ink); margin-right: 6px; }
    .assessment-tracker {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 90;
      width: min(340px, calc(100vw - 24px));
      border: 1px solid #b7ded7;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 14px 38px rgba(15, 23, 42, .2);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .assessment-tracker[hidden] { display: none; }
    .assessment-tracker-resume {
      min-width: 0;
      border: 0;
      background: #fff;
      padding: 10px 11px;
      color: var(--ink);
      text-align: left;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 9px;
    }
    .assessment-tracker-resume:hover { background: #f7fbfa; }
    .assessment-tracker-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 7px;
      background: var(--teal-soft);
      color: var(--teal-dark);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 900;
    }
    .assessment-tracker-copy { min-width: 0; display: grid; gap: 1px; }
    .assessment-tracker-copy strong { font-size: 12px; }
    .assessment-tracker-copy span {
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .assessment-tracker-close {
      width: 35px;
      border: 0;
      background: #fff;
      color: var(--muted);
      font-size: 17px;
    }
    .assessment-tracker-close:hover { background: #f8fafc; color: var(--ink); }
    .assessment-tracker-resume:focus-visible,
    .assessment-tracker-close:focus-visible { outline: 2px solid var(--teal); outline-offset: -3px; }

    .draft-dialog {
      width: min(430px, calc(100vw - 24px));
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0;
      color: var(--ink);
      box-shadow: 0 24px 60px rgba(15, 23, 42, .26);
    }
    .draft-dialog::backdrop { background: rgba(15, 23, 42, .35); }
    .draft-dialog-head { padding: 15px 16px 10px; }
    .draft-dialog-head h2 { margin: 0; font-size: 16px; }
    .draft-dialog-body { padding: 0 16px 14px; color: #475569; font-size: 12px; line-height: 1.6; }
    .draft-dialog-actions {
      padding: 10px 16px 15px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 7px;
    }
    .draft-dialog-actions button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      padding: 6px 10px;
      font-weight: 700;
    }
    .draft-dialog-actions .primary {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }
    .role-select {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      .app-body { grid-template-columns: var(--sidebar-collapsed) minmax(0, 1fr); }
      .sidebar { padding-inline: 8px; }
      .nav-label,
      .toggle-label { display: none; }
      .nav button { justify-content: center; padding-inline: 0; }
      .sidebar-toggle {
        width: 100%;
        min-height: 36px;
        padding: 0;
        justify-content: center;
      }
    }
    @media (max-width: 620px) {
      .topbar { padding-left: 18px; }
      .home-select { width: min(220px, calc(100vw - 160px)); }
      .top-meta { display: none; }
    }
  </style>

  <script>
    const modules = {
      workbench: { label: "工作台", src: "workbench/index.html?embed=1&v=20261120-version-badge" },
      residents: { label: "住客管理", src: "residents/index.html?embed=1&v=20261120-version-badge" },
      training: { label: "訓練時間表", src: "training/index.html?embed=1&v=20261120-version-badge" },
      records: { label: "復康運動紀錄", src: "records/index.html?embed=1&v=20261120-version-badge" },
      assessment: { label: "評估系統", src: "assessment/paper-aligned.html?embed=1&v=20261120-version-badge" },
      icp: { label: "ICP", src: "icp/worklist.html?embed=1&v=20261120-version-badge" },
      settings: { label: "院舍設定", src: "settings/index.html?embed=1&v=20261120-version-badge" }
    };

    const navButtons = document.querySelectorAll(".nav button");
    const frame = document.getElementById("module-frame");
    const placeholder = document.getElementById("placeholder");
    const placeholderTitle = document.getElementById("placeholder-title");
    const app = document.querySelector(".app");
    const sidebarToggle = document.getElementById("sidebar-toggle");
    const homeSelect = document.getElementById("home-select");
    const assessmentTracker = document.getElementById("assessment-tracker");
    const assessmentTrackerResume = document.getElementById("assessment-tracker-resume");
    const assessmentTrackerClose = document.getElementById("assessment-tracker-close");
    const assessmentCloseDialog = document.getElementById("assessment-close-dialog");
    const currentRoleSelect = document.getElementById("current-role-select");
    const currentUserAvatar = document.getElementById("current-user-avatar");
    const ACTIVE_ASSESSMENT_DRAFT_KEY = OT_MOCK_STORAGE_KEYS.assessmentDraft;
    let currentModuleKey = "workbench";
    let activeAssessmentDraft = readShellAssessmentDraft();
    const escapeHtml = value => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function applyCurrentUser() {
      const user = OT_PROTOTYPE.currentUser();
      currentRoleSelect.value = user.role === "PT" ? "pt" : "ot";
      currentUserAvatar.textContent = user.role === "PT" ? "P" : "T";
    }

    function readShellAssessmentDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(ACTIVE_ASSESSMENT_DRAFT_KEY));
        return draft && typeof draft === "object" ? draft : null;
      } catch (error) {
        return null;
      }
    }

    function writeShellAssessmentDraft(draft) {
      activeAssessmentDraft = draft || null;
      try {
        if (activeAssessmentDraft) {
          localStorage.setItem(ACTIVE_ASSESSMENT_DRAFT_KEY, JSON.stringify(activeAssessmentDraft));
        } else {
          localStorage.removeItem(ACTIVE_ASSESSMENT_DRAFT_KEY);
        }
      } catch (error) {
        // The in-memory draft still works during this shell session.
      }
    }

    function assessmentRoleSummary(draft) {
      const roles = draft?.record?.roles;
      if (!roles) return "草稿已保留";
      const ot = roles.ot?.complete ? "OT 已完成" : "OT 待完成";
      const pt = roles.pt?.complete ? "PT 已完成" : "PT 待完成";
      return `${ot} · ${pt}`;
    }

    function renderAssessmentTracker() {
      const draft = activeAssessmentDraft || readShellAssessmentDraft();
      const active = Boolean(
        draft &&
        draft.record?.status !== "completed" &&
        !draft.dismissed &&
        currentModuleKey !== "assessment"
      );
      assessmentTracker.hidden = !active;
      if (!active) return;
      document.getElementById("assessment-tracker-resident").textContent =
        `${draft.resident?.bed || "016"} · ${draft.resident?.name || "評估進行中"}`;
      document.getElementById("assessment-tracker-progress").textContent =
        `${draft.record?.code || "016"} · ${assessmentRoleSummary(draft)}`;
    }

    function postDraftToAssessmentFrame() {
      if (currentModuleKey !== "assessment" || !activeAssessmentDraft || !frame.contentWindow) return;
      const frameUrl = new URL(frame.src, location.href);
      if (frameUrl.searchParams.get("mode") !== "session") return;
      frame.contentWindow.postMessage(
        { type: "ot-assessment-restore", draft: activeAssessmentDraft },
        "*"
      );
    }

    function resumeAssessment() {
      const draft = activeAssessmentDraft || readShellAssessmentDraft();
      if (!draft?.resumeUrl) return;
      draft.dismissed = false;
      writeShellAssessmentDraft(draft);
      openModule("assessment", draft.resumeUrl);
    }

    function renderHomeOptions() {
      homeSelect.innerHTML = OT_HOME_SETTINGS.getHomeList().map(home => (
        `<option value="${home.code}">${home.code} · ${home.name}</option>`
      )).join("");
      homeSelect.value = OT_HOME_SETTINGS.getActiveHomeCode();
    }

    function setSidebarCollapsed(collapsed) {
      app.classList.toggle("sidebar-collapsed", collapsed);
      sidebarToggle.title = collapsed ? "展開側欄" : "收起側欄";
      sidebarToggle.setAttribute("aria-label", sidebarToggle.title);
      sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
      try {
        localStorage.setItem("ot-shell.sidebar-collapsed", collapsed ? "1" : "0");
      } catch (error) {
        // The shell still works when storage is unavailable.
      }
    }

    try {
      setSidebarCollapsed(localStorage.getItem("ot-shell.sidebar-collapsed") === "1");
    } catch (error) {
      setSidebarCollapsed(false);
    }

    sidebarToggle.addEventListener("click", () => {
      setSidebarCollapsed(!app.classList.contains("sidebar-collapsed"));
    });

    homeSelect.addEventListener("change", () => {
      OT_HOME_SETTINGS.setActiveHome(homeSelect.value);
      openModule(currentModuleKey);
    });

    currentRoleSelect.addEventListener("change", () => {
      OT_PROTOTYPE.setCurrentUser(currentRoleSelect.value);
      applyCurrentUser();
      openModule(currentModuleKey);
    });

    window.addEventListener("storage", event => {
      if (event.key === OT_HOME_SETTINGS.activeHomeKey && event.newValue) {
        homeSelect.value = event.newValue;
      }
      if (event.key === OT_HOME_SETTINGS.storageKey) renderHomeOptions();
      if (event.key === ACTIVE_ASSESSMENT_DRAFT_KEY) {
        activeAssessmentDraft = readShellAssessmentDraft();
        renderAssessmentTracker();
      }
    });

    assessmentTrackerResume.addEventListener("click", resumeAssessment);
    assessmentTrackerClose.addEventListener("click", () => {
      assessmentCloseDialog.showModal();
    });
    document.getElementById("assessment-keep-working").addEventListener("click", () => {
      assessmentCloseDialog.close();
    });
    document.getElementById("assessment-dismiss-tracker").addEventListener("click", () => {
      if (activeAssessmentDraft) {
        activeAssessmentDraft.dismissed = true;
        writeShellAssessmentDraft(activeAssessmentDraft);
      }
      assessmentCloseDialog.close();
      renderAssessmentTracker();
    });
    assessmentCloseDialog.addEventListener("cancel", () => {
      assessmentCloseDialog.close();
    });

    window.addEventListener("message", event => {
      if (event.source !== frame.contentWindow) return;
      if (event.data?.type === "ot-open-module" && modules[event.data.module]) {
        const source = String(event.data.source || modules[event.data.module].src);
        if (source.startsWith(`${event.data.module}/`)) {
          openModule(event.data.module, source);
        }
        return;
      }
      if (event.data?.type === "ot-assessment-draft-cleared") {
        writeShellAssessmentDraft(null);
        renderAssessmentTracker();
        return;
      }
      if (event.data?.type === "ot-assessment-draft" && event.data.draft) {
        writeShellAssessmentDraft(event.data.draft);
        renderAssessmentTracker();
      }
    });

    frame.addEventListener("load", () => {
      postDraftToAssessmentFrame();
      renderAssessmentTracker();
    });

    function openModule(key, sourceOverride = null) {
      currentModuleKey = key;
      const button = document.querySelector(`.nav button[data-module="${key}"]`);
      const module = modules[key];
      const label = module?.label || button?.querySelector("span")?.textContent || key;
      navButtons.forEach(item => {
        const active = item === button;
        item.classList.toggle("active", active);
        if (active) item.setAttribute("aria-current", "page");
        else item.removeAttribute("aria-current");
      });

      if (module) {
        let source = sourceOverride || module.src;
        if (key === "assessment" && !sourceOverride) {
          source = `${module.src}&view=manager&refresh=${Date.now()}`;
        }
        placeholder.hidden = true;
        frame.hidden = false;
        frame.title = label;
        frame.src = source;
      } else {
        frame.hidden = true;
        placeholder.hidden = false;
        placeholderTitle.textContent = label;
      }

      history.replaceState(null, "", `#${key}`);
      renderAssessmentTracker();
    }

    navButtons.forEach(button => {
      button.addEventListener("click", () => openModule(button.dataset.module));
    });

    applyCurrentUser();
    renderHomeOptions();
    renderAssessmentTracker();
    const initialModule = location.hash.slice(1);
    if (initialModule && document.querySelector(`.nav button[data-module="${initialModule}"]`)) {
      openModule(initialModule);
    }
  </script>
